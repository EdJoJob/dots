# Global mise tools — one manifest so the SAME tools land the SAME way on
# macOS/Debian/RedHat. Policy: mise first, uv (pipx backend below runs uvx)
# for python tools, OS packages only for C-linked system things
# (install/Brewfile, install/packages-*.txt).
# Per-machine additions: side-car ships ~/.config/mise/conf.d/*.toml.

[settings]
# python tools install through uv (uvx), not pipx
pipx.uvx = true

[tools]
# runtimes the backends below need
node = "lts"        # npm: backend
uv = "latest"       # pipx: backend (via uvx)

# updater (replaces the old update-all script)
topgrade = "latest"

# editor + its build deps. nvim is mise-managed on every platform because the
# nvim config tracks nvim-treesitter's main branch, which hard-requires nvim
# >= 0.12; distro repos lag (Fedora 42 ships 0.11.5, where vim.list is absent
# and every parser install dies in config.lua). aqua pulls the official
# release tarball, runtime files included, so VIMRUNTIME stays consistent.
"aqua:neovim/neovim" = "latest"
# tree-sitter CLI: nvim-treesitter main compiles parsers locally and needs
# this >= 0.26.1. Upstream is explicit that the npm build is NOT supported.
# Also needs a C compiler — an OS package (install/packages-*.txt).
"aqua:tree-sitter/tree-sitter" = "latest"

# git
"github:tummychow/git-absorb" = "latest"

# python tools (uvx)
"pipx:proselint" = "latest"
"pipx:rstcheck" = "latest"
"pipx:yq" = "latest"
"pipx:lieer" = "latest"     # gmi — gmail <-> notmuch sync (docs/MAIL.md)

# nvim language servers (gopls stays an OS package — properly packaged everywhere)
"npm:pyright" = "latest"
"npm:typescript-language-server" = "latest"
"npm:yaml-language-server" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:vim-language-server" = "latest"

# prose linter (was an npm global)
"npm:alex" = "latest"

# markdown review UI — serves a doc for inline feedback (replaces npx invocation)
"npm:md-feedback-ui" = "latest"
