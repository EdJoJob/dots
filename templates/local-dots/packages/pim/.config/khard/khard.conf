# khard config — address book paths must line up with the vdirsyncer
# contacts pairs in this package. Non-path option values are stock defaults.
# Syntax per khard docs: https://khard.readthedocs.io/en/latest/
# (configobj INI; [addressbooks] with one [[subsection]] per book).

[addressbooks]

[[example@personal-gmail.com]]
path = ~/.contacts/example@personal-gmail.com/

[[o365]]
path = ~/.contacts/o365/contacts/

[general]
debug = no
default_action = list
editor = vim
merge_editor = vimdiff

[contact table]
display = first_name
group_by_addressbook = no
reverse = no
show_nicknames = no
show_uids = no
sort = last_name
localize_dates = yes
preferred_phone_number_type = pref, cell, home
preferred_email_address_type = pref, work, home

[vcard]
private_objects = ,
preferred_version = 3.0
search_in_source_files = no
skip_unparsable = no
