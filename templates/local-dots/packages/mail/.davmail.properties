# Sanitized davmail template. Kept for reference only -- no O365 account at
# present.
# All credential-bearing keys stripped: davmail writes the oauth refreshToken
# back into this file itself when persistToken=true -- never commit it.

# Exchange / O365
davmail.mode=O365Interactive
davmail.url=https://outlook.office365.com/EWS/Exchange.asmx
davmail.oauth.tenantId=<TENANT-ID>
davmail.oauth.clientId=<CLIENT-ID>
davmail.oauth.persistToken=true
davmail.oauth.redirectUri=
# davmail.oauth.<account>.refreshToken=  (secret; written by davmail at runtime)
davmail.defaultDomain=

# Local listeners (loopback only)
davmail.server=false
davmail.allowRemote=false
davmail.bindAddress=
davmail.imapPort=1143
davmail.smtpPort=1025
davmail.popPort=1110
davmail.caldavPort=1080
davmail.ldapPort=1389

# IMAP / SMTP / POP behaviour
davmail.imapIdleDelay=
davmail.imapAutoExpunge=true
davmail.imapAlwaysApproxMsgSize=false
davmail.smtpSaveInSent=true
davmail.sentKeepDelay=0
davmail.keepDelay=30
davmail.popMarkReadOnRetr=false
davmail.folderSizeLimit=
davmail.forceActiveSyncUpdate=false

# Caldav / Carddav
davmail.caldavAutoSchedule=true
davmail.caldavEditNotifications=false
davmail.caldavPastDelay=
davmail.carddavReadPhoto=true

# Proxy (unused)
davmail.enableProxy=false
davmail.useSystemProxies=false
davmail.proxyHost=
davmail.proxyPort=
davmail.proxyUser=
# davmail.proxyPassword=  (secret; omitted)
davmail.noProxyFor=

# SSL keystore (unused)
davmail.ssl.keystoreType=
davmail.ssl.keystoreFile=
# davmail.ssl.keystorePass=  (secret; omitted)
# davmail.ssl.keyPass=  (secret; omitted)
davmail.ssl.clientKeystoreType=
davmail.ssl.clientKeystoreFile=
# davmail.ssl.clientKeystorePass=  (secret; omitted)
davmail.ssl.nosecureimap=false
davmail.ssl.nosecuresmtp=false
davmail.ssl.nosecurepop=false
davmail.ssl.nosecurecaldav=false
davmail.ssl.nosecureldap=false

# Misc
davmail.enableKerberos=false
davmail.enableKeepAlive=false
davmail.clientSoTimeout=
davmail.disableUpdateCheck=false
davmail.disableGuiNotifications=false
davmail.disableTrayActivitySwitch=false
davmail.showStartupBanner=true

# Logging
log4j.rootLogger=WARN
log4j.logger.davmail=DEBUG
log4j.logger.httpclient=WARN
log4j.logger.httpclient.wire=WARN
log4j.logger.org.apache.http=WARN
log4j.logger.org.apache.http.wire=WARN
log4j.logger.org.apache.http.conn.ssl=WARN
